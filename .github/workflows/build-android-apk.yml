name: Build Fluid Android Chromium APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java JDK 21 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Web Dependencies & Build Fluid Studio
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 6. Install Capacitor Android & Generate Android Project
        run: |
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          if [ ! -f capacitor.config.json ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.itihaskarsamay.fluidstudio",
            "appName": "Fluid Itihaskar",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          fi
          npx cap add android || true
          npx cap sync android

      - name: 7. Build Debug Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Ready-to-Install Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fluid-itihaskar-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
