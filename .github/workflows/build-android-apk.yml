name: Build Fluid Android Chromium APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java JDK 17 (For Capacitor Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Build Web Bundle & Compile Android APK
        run: |
          if [ ! -f package.json ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Entering subfolder: $SUBDIR"
              cd "$SUBDIR"
            fi
          fi

          npm install --legacy-peer-deps
          npm run build

          npm install --legacy-peer-deps @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.itihaskarsamay.fluidstudio",
            "appName": "Fluid Itihaskar",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

          rm -rf android
          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-out/fluid-itihaskar-studio.apk"

      - name: 5. Upload Ready-to-Install Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fluid-itihaskar-android-apk
          path: apk-out/fluid-itihaskar-studio.apk
          if-no-files-found: error
